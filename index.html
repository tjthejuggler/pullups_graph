<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pullups Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Pullups Progress Tracker</h1>
            <p class="subtitle">Track your daily pullup sessions and progress</p>
        </header>

        <div class="main-content">
            <div class="chart-section">
                <div class="chart-container">
                    <canvas id="pullupsChart"></canvas>
                </div>
            </div>

            <div class="stats-panel">
                <h2>📊 Statistics</h2>
                
                <div class="stat-card current" data-tooltip="">
                    <div class="stat-label">Today's Total</div>
                    <div class="stat-value" id="todayTotal">-</div>
                </div>

                <div class="stat-card highlight" data-tooltip="">
                    <div class="stat-label">Highest Day Ever</div>
                    <div class="stat-value" id="highestDay">-</div>
                </div>

                <div class="stat-card" data-tooltip="">
                    <div class="stat-label">This Week</div>
                    <div class="stat-value" id="thisWeek">-</div>
                </div>

                <div class="stat-card highlight" data-tooltip="">
                    <div class="stat-label">Highest Week Ever</div>
                    <div class="stat-value" id="highestWeek">-</div>
                </div>

                <div class="stat-card" data-tooltip="">
                    <div class="stat-label">This Month</div>
                    <div class="stat-value" id="thisMonth">-</div>
                </div>

                <div class="stat-card highlight" data-tooltip="">
                    <div class="stat-label">Highest Month Ever</div>
                    <div class="stat-value" id="highestMonth">-</div>
                </div>

                <div class="stat-card special" data-tooltip="">
                    <div class="stat-label">🏆 Best Session</div>
                    <div class="stat-value" id="highestSession">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
